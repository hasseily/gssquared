name: Generate PR-series renderer shaders

on:
  push:
    branches: ['codex/pr-series-validation']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-series-shaders-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shaders:
    name: Generate all PR13 shader formats
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Build pinned shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          python scripts/ci/install_shader_tools.py --prefix "$RUNNER_TEMP/shader-tools"
      - name: Compile and identify shaders
        run: |
          shader_compiler="$(command -v glslangValidator || command -v glslang)"
          python scripts/shaders/compile_postprocess.py --glslang "$shader_compiler"
          python scripts/ci/shader_manifest.py --write
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr13-offline-shaders
          path: assets/shaders/postprocess/
          if-no-files-found: error
          retention-days: 14
